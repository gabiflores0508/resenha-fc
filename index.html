<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resenha FC</title>
<meta name="theme-color" content="#2356A8">
<meta name="description" content="Resenha FC: lista de presença, sorteio de times e placar.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#14213D; --muted:#56657F; --line:#D6DEE9; --field:#F6F8FB;
  --link:#2356A8;
  --court:#2356A8; --court-idle:#48618E; --court-off:#5B6477; --court-line:rgba(255,255,255,.2);
  --on-court:#FFFFFF; --on-court-muted:rgba(255,255,255,.8);
  --paint:#F2C230; --paint-ink:#231B00;
  --no:#B83A32; --ok:#1B7A4B; --focus:#2356A8;
  --display:"Saira Extra Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1422; --surface:#142035; --ink:#E6EDF7; --muted:#97A6BF; --line:#25344F; --field:#0F192B;
    --link:#8FB4F0;
    --court:#1E4C98; --court-idle:#2E4468; --court-off:#353E50; --court-line:rgba(255,255,255,.14);
    --no:#F2837A; --ok:#4CC38A; --focus:#F2C230; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#142035; --ink:#E6EDF7; --muted:#97A6BF; --line:#25344F; --field:#0F192B;
  --link:#8FB4F0;
  --court:#1E4C98; --court-idle:#2E4468; --court-off:#353E50; --court-line:rgba(255,255,255,.14);
  --no:#F2837A; --ok:#4CC38A; --focus:#F2C230; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
main{max-width:34rem;margin:0 auto;padding:12px 16px 56px}
button,input,textarea,select{font:inherit;color:inherit}
select.in{max-width:16rem;cursor:pointer}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hero :focus-visible{outline-color:var(--paint)}
img,svg{max-width:100%}

/* Navegação entre dias */
.nav-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 10px}
.pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pick label{font-weight:600;font-size:.92rem;color:var(--muted)}
.pick .in{width:auto;flex:1 1 10rem}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--paint);flex:none}
.chip .dot.idle{background:transparent;border:1.5px solid currentColor;opacity:.6}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-mid{display:flex;flex-direction:column;align-items:center;min-width:0}
.nav-rel{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;line-height:1.1}
.linkbtn{border:0;background:none;color:var(--link);font-weight:600;padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem;border-radius:4px}

/* A quadra */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--court);color:var(--on-court);padding:22px 20px 22px;isolation:isolate;transition:background-color .35s ease}
.hero.idle{background:var(--court-idle)}
.hero.off{background:var(--court-off)}
.court{position:absolute;inset:0;width:100%;height:100%;color:var(--court-line);z-index:-1;pointer-events:none}
.h-date{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--paint);margin:0 0 4px;letter-spacing:.01em}
.h-title{font-family:var(--display);font-weight:800;font-size:clamp(2.75rem,12vw,4rem);line-height:.92;margin:0;letter-spacing:-.005em;text-wrap:balance}
.h-sub{margin:12px 0 0;color:var(--on-court-muted);max-width:32ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin:14px 0 0;font-weight:600;font-size:1.05rem}
.meta span{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.meta svg{width:18px;height:18px;flex:none;opacity:.85}
.note{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--paint);background:rgba(0,0,0,.16);border-radius:0 8px 8px 0;font-size:.95rem;overflow-wrap:anywhere}
.slots{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:20px 0 8px}
.slot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.42)}
.slot.on{background:var(--paint);border-color:var(--paint)}
.slot.gk{border-radius:5px}
.slot-sep{width:2px;height:18px;background:rgba(255,255,255,.35);margin:0 5px;border-radius:1px}
.need{font-family:var(--display);font-weight:800;font-size:1.65rem;color:var(--paint);margin:4px 0 2px;line-height:1.1}
.hero .opt{opacity:.85}
.slot.you{box-shadow:0 0 0 2px var(--court),0 0 0 4px #fff}
.slot.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.tally{margin:0;font-size:.98rem;color:var(--on-court-muted)}
.tally strong{color:var(--on-court);font-family:var(--display);font-size:1.55rem;font-weight:800;margin-right:2px}

/* Minha resposta */
.mine{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.22)}
.mine:empty{display:none}
.mine-q{display:block;font-family:var(--display);font-weight:700;font-size:1.55rem;margin:0 0 10px;line-height:1.15}
.mine-state{margin:0 0 12px;font-weight:600;font-size:1.08rem}
.mine-note{margin:0;color:var(--on-court-muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.b-yes{background:var(--paint);color:var(--paint-ink);border:0;border-radius:12px;padding:6px 28px;font-family:var(--display);font-weight:800;font-size:1.55rem;cursor:pointer;min-height:54px}
.b-yes.sm{font-size:1.3rem;padding:4px 22px;min-height:48px}
.b-no{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:4px 20px;font-family:var(--display);font-weight:700;font-size:1.35rem;cursor:pointer;min-height:54px}
.b-yes:disabled,.b-no:disabled,.btn:disabled,.rm:disabled{opacity:.55;cursor:default}
.chk{display:inline-flex;align-items:center;gap:9px;margin-top:14px;cursor:pointer;font-weight:500}
.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--paint)}
.chk.plain{margin-top:0;color:var(--ink)}
.chk.plain input{accent-color:var(--court)}
.j-input{flex:1 1 11rem;min-width:0;height:48px;border-radius:10px;border:0;padding:0 14px;background:#fff;color:#14213D;font-weight:500}

/* Listas */
.block{margin-top:30px}
.block h2{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0 0 6px;display:flex;align-items:baseline;gap:10px;line-height:1.1}
.count{font-family:var(--body);font-size:.95rem;font-weight:600;color:var(--muted)}
.roster{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.roster li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);min-height:48px}
.roster .av{width:32px;height:32px}
.roster .n{width:1.9rem;flex:none;text-align:right;font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--muted);font-variant-numeric:tabular-nums}
.roster .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.roster li.me .nm{font-weight:700}
.tag{flex:none;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--paint);color:var(--paint-ink)}
.tag.soft{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rm{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;color:var(--no);cursor:pointer;font-size:.88rem;font-weight:600}
.empty{color:var(--muted);margin:8px 0 0}
.names{margin:0;overflow-wrap:anywhere}
.names .me{font-weight:700}

/* Botões e campos */
.btn{min-height:46px;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer;border:1px solid transparent}
.btn.pri{background:var(--court);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.warn{background:transparent;border-color:var(--no);color:var(--no)}
.btn.wide{width:100%;margin-top:30px;min-height:52px;font-size:1.05rem}
.in{height:46px;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:0 12px;color:var(--ink);font-weight:500;font-size:1rem;width:100%;min-width:0}
.in.grow{flex:1 1 10rem;width:auto}
.ta{height:auto;padding:10px 12px;line-height:1.45;resize:vertical;margin-top:6px}
#copyout{margin-top:14px}
#copyout:empty{display:none}

/* Abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;margin:0 -16px 16px;padding:4px 16px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:48px;border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--muted);cursor:pointer;border-radius:8px 8px 0 0;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--focus)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--paint);flex:none}
[role="tabpanel"][hidden]{display:none!important}
.tabs:empty,.nav:empty{display:none}

/* Avatares */
.av{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;overflow:hidden}
.ini{background:var(--ac,#48618E);color:#fff;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1;letter-spacing:.02em}
.teams-note{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--paint);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600;text-align:left;cursor:pointer}
.teams-note .go{margin-left:auto;color:var(--link);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.stack{display:flex;flex:none}
.stack .av{width:28px;height:28px;border:2px solid var(--surface);margin-left:-8px}
.stack .av:first-child{margin-left:0}
.me-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.me-card .av{width:60px;height:60px;font-size:1.5rem}
.me-info{min-width:0;flex:1}
.me-info strong{display:block;font-family:var(--display);font-size:1.4rem;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.me-info .row{margin-top:6px;gap:6px 10px}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem;display:inline-flex;align-items:center}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* Sorteio: escalação na quadra */
.teams-meta{color:var(--muted);margin:0 0 10px;font-size:.95rem}
.gk-line{margin:0 0 12px;font-weight:600}
.gk-line .opt{color:var(--muted);font-weight:400}
.warn-line{margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--no);background:var(--surface);border-radius:0 8px 8px 0;font-size:.95rem;overflow-wrap:anywhere}
.tlabel{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0 0 8px}
.tlabel.below{margin:8px 0 0}
.tlabel strong{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;display:inline-flex;align-items:center;gap:8px}
.tlabel strong::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--tc);flex:none}
.tlabel span{color:var(--muted);font-size:.92rem;font-weight:500}
.pitch{position:relative;width:100%;aspect-ratio:5/8;border-radius:16px;overflow:hidden;color:#fff;background:
  radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.3)),
  repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 6.25%,rgba(255,255,255,0) 6.25% 12.5%),
  var(--court)}
.pitch.half.msg{aspect-ratio:5/4}
.pitch.tall{aspect-ratio:5/11}
.pitch.tall .tok{width:80px}
.pitch.tall .tok .ph{width:40px;height:40px}
.pitch.tall .tok .pos{left:calc(50% - 30px)}
.pitch.tall .tok .plate{max-width:80px;font-size:.9rem}
.pitch.half,.pitch.half.tall{aspect-ratio:1/1}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.5)}
.pitch .lines *{vector-effect:non-scaling-stroke}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:86px;pointer-events:none}
.tok .ph{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid var(--tc);background:#1B2A48;box-shadow:0 5px 12px rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:center}
.tok .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tok .ph .ini{width:100%;height:100%;display:grid;place-items:center;font-size:1.2rem}
.tok .pos{position:absolute;top:-4px;left:calc(50% - 33px);z-index:1;padding:0 4px;border-radius:4px;background:var(--tc);color:#1A1400;font-family:var(--body);font-size:.6rem;font-weight:800;letter-spacing:.04em;line-height:1.55}
.tok .plate{margin-top:3px;max-width:86px;padding:1px 7px;border-radius:6px;background:rgba(8,15,30,.86);color:#fff;font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.me .plate{background:var(--paint);color:var(--paint-ink)}
.tok.rot .ph{border-style:dashed}
/* Banco de reservas na lateral */
.field{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:stretch}
.field.nobench{grid-template-columns:minmax(0,1fr)}
.field .pitch{height:100%}
.bench-col{display:flex;flex-direction:column;gap:8px}
.bench-half{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 3px 12px;border-radius:12px;color:#fff;background:linear-gradient(rgba(0,0,0,.24),rgba(0,0,0,.24)),var(--court)}
.bench-half.empty{background:transparent;border:1px dashed var(--line)}
.bench-half::before{content:"";position:absolute;top:32px;bottom:14px;left:50%;width:12px;transform:translateX(-50%);border-radius:6px;background:rgba(255,255,255,.13)}
.bench-half.empty::before{display:none}
.bench-l{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.8)}
.bench-half.empty .bench-l{color:var(--muted)}
.btok{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:78px}
.btok .ph{width:38px;height:38px;border-radius:50%;border:3px solid var(--tc);overflow:hidden;background:#1B2A48;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.btok .ph img{width:100%;height:100%;object-fit:cover;display:block}
.btok .ph .ini{width:100%;height:100%;display:grid;place-items:center;font-size:1rem}
.btok .plate{margin-top:2px;max-width:78px;padding:0 5px;border-radius:5px;background:rgba(8,15,30,.86);color:#fff;font-family:var(--display);font-weight:700;font-size:.84rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btok.me .plate{background:var(--paint);color:var(--paint-ink)}
.btok.gone{opacity:.45}
.btok.gone .plate{text-decoration:line-through}
.teams.reveal .btok{animation:benchIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 80ms)}
@keyframes benchIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tok.gone{opacity:.45}
.tok.gone .plate{text-decoration:line-through}
.tok.nogk .ph{border-style:dashed;border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);box-shadow:none}
.tok.nogk .ph svg{width:22px;height:22px;opacity:.8}
.tok.nogk{width:130px}
.tok.nogk .plate{max-width:130px;background:transparent;font-family:var(--body);font-weight:600;font-size:.78rem;color:rgba(255,255,255,.85)}
.teams.reveal .tok{animation:drop .5s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(var(--i) * 80ms)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.pitch-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.pitch-msg div{background:rgba(8,15,30,.72);border-radius:12px;padding:14px 16px;max-width:22rem}
.pitch-msg strong{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;margin-bottom:4px}
.pitch-msg p{margin:0;color:rgba(255,255,255,.85);font-size:.95rem}
.bench{margin-top:26px}
.bench h3{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 8px}
.draw-ctl{margin-top:20px}
.draw-ctl.solo{margin-top:20px}
.draw-ctl h2{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0 0 10px;line-height:1.1}
.seg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 4px}
.seg-label{font-weight:600;color:var(--muted);font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-width:50px;min-height:44px;border:0;background:transparent;font-weight:700;cursor:pointer;font-family:var(--display);font-size:1.25rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
.teams .btn.wide{margin-top:18px}.teams .btn.wide{margin-top:18px}

/* Quadra deitada (note) */
.only-d{display:none}
.pitch.wide{aspect-ratio:2/1}
.hlabels{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hlabels .tlabel:last-child{justify-content:flex-end;text-align:right}
.hbench{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.hb{border-radius:12px;padding:10px 12px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.24),rgba(0,0,0,.24)),var(--court)}
.hb.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.hb-l{display:block;font-size:.8rem;font-weight:700;opacity:.85;margin-bottom:8px}
.hb-row{display:flex;flex-wrap:wrap;gap:10px 4px}
.hb-none{font-size:.9rem}
.bench-grid{display:grid;gap:0 24px}
.team-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.team-actions .btn{flex:1 1 12rem;min-height:50px}

/* Pagamento */
.pay{margin-top:16px;padding:14px 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pay h2{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0 0 2px;line-height:1.1}
.pay-price{margin:0;font-weight:600}
.pay-pix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.pay-pix code{font-family:var(--body);font-weight:600;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.pay-me{margin:12px 0 0;font-weight:700}
.pay-me.ok{color:var(--ok)}
.pay-me.no{color:var(--no)}
.pay-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.pay-bar span{display:block;height:100%;background:var(--ok);border-radius:4px}
.pay-sum{margin:6px 0 0;color:var(--muted);font-size:.93rem}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.paylist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.paylist li{padding:8px 0;border-bottom:1px solid var(--line)}
.paylist .chk{gap:10px;width:100%}
.paylist .av{width:28px;height:28px;font-size:.85rem}
.pay-gk{margin-top:12px}

/* Placar */
.score{margin-top:30px}
.score h2{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0 0 8px;line-height:1.1}
.score h3{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 10px}
.matches{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.match{display:grid;grid-template-columns:1.4rem minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.match .mn{color:var(--muted);font-family:var(--display);font-weight:700;text-align:right}
.match .ta{justify-self:end}
.match .res{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.3;padding:0 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums;white-space:nowrap}
.tname{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.tname::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--tc);flex:none}
.win .tname{font-weight:800}
.tbl-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.tbl th{font-size:.8rem;color:var(--muted);font-weight:600;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}
.tbl td.strong{font-weight:800}
.tbl tr.me td{background:rgba(242,194,48,.14)}
.tbl .who{display:flex;align-items:center;gap:8px;min-width:0}
.tbl .who span{overflow:hidden;text-overflow:ellipsis;max-width:9.5rem}
.tbl .who .av{width:28px;height:28px;font-size:.85rem}
.tbl .rk{font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--muted);width:1.8rem}
.tbl tr.top1 .rk{color:var(--ink)}
.sc-form{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sc-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.sc-side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:1.4rem;font-weight:700;line-height:1;cursor:pointer;flex:none}
.stepper output{font-family:var(--display);font-weight:800;font-size:2.4rem;min-width:2ch;text-align:center;line-height:1}
.sc-vs{font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.4rem;align-self:end;padding-bottom:10px}

/* Histórico */
.hist-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:6px}
.hist-head h2,.hist-games h2{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.1}
.hist-games{margin-top:30px}
.hist-games h2{margin-bottom:10px}
.hsum{margin:0 0 12px;color:var(--muted)}
.hgames{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.hgame{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer}
.hgame .hd{font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.05;min-width:3.6rem}

.hgame .go{color:var(--link);font-weight:600;font-size:.9rem;white-space:nowrap}
.ychips{display:flex;gap:6px}

/* Imagem da escalação */
.shot{position:fixed;inset:0;z-index:30;background:rgba(6,10,20,.86);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.shot[hidden]{display:none!important}
.shot-box{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%;max-height:100%}
.shot-box img{display:block;max-width:100%;max-height:calc(100vh - 190px);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);object-fit:contain}
.shot-box p{color:rgba(255,255,255,.85);margin:0;font-size:.92rem;text-align:center}
.shot-box .row{justify-content:center}
.shot-box .btn.ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.empty-note{margin:0;padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* Jogo: ordem no celular */
#p-jogo{display:flex;flex-direction:column}
#p-jogo .col-a,#p-jogo .col-b{display:contents}
#hero{order:1}
#teams-note{order:2}
#pay{order:3}
#lists{order:4}
#foot{order:5}

/* Área dos adm */
.admin{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px 20px}
.admin h2{font-family:var(--display);font-weight:700;font-size:1.65rem;margin:0;line-height:1.1}
.admin h3{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:26px 0 2px}
.admin .hint:last-child{margin-bottom:0}
.hint{color:var(--muted);margin:4px 0 14px;font-size:.95rem}
.hint.tight{margin:12px 0 0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:600;color:var(--muted)}
.opt{font-weight:400}
.acts{margin-top:16px}
.admins{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.admins li{padding:10px 0;border-bottom:1px solid var(--line)}

.foot{margin-top:30px;color:var(--muted);font-size:.93rem}
.foot p{margin:0 0 8px}
.foot strong{color:var(--ink)}
.foot .signout{margin-top:14px;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);font-weight:500;box-shadow:0 6px 24px rgba(10,20,40,.25);z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:900px){
  main{max-width:1120px;padding:16px 32px 64px}
  .nav{max-width:560px;margin-left:auto;margin-right:auto}
  .chips{justify-content:center}
  .tabs{margin:0 0 24px;padding:4px 0 0;gap:8px}
  .tab{flex:0 0 auto;padding:0 26px}
  #p-jogo{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0 40px;align-items:start}
  #p-jogo .col-a,#p-jogo .col-b{display:block}
  #lists > .block:first-child{margin-top:0}
  .only-m{display:none}
  .only-d{display:block}
  #p-sorteio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:start}
  #p-sorteio > #teams{grid-column:1/-1}
  #p-sorteio > #draw-ctl .draw-ctl{margin-top:30px}
  .bench-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .team-actions .btn{flex:0 0 auto}
  .admin-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .hist-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0 40px;align-items:start}
  .hist-games{margin-top:0}
}
@media (max-width:380px){
  .tab{font-size:1.15rem}
  .hero{padding:18px 16px 20px}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<div class="shot" id="shot" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

const ICON = {
  left:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

const S = {
  db:null, uid:null, isOwner:false, meName:"",
  state:"loading", subErr:false,
  members:{}, games:{}, admins:[],
  loaded:{m:false,g:false,a:false,s:false},
  readOnly:false, busy:false, key:null, userNav:false, picking:false, weekday:4, gkPre:false,
  armed:null, armTimer:null, renaming:false, popPending:false,
  drafts:{}, nt:null, tab:"jogo", user:null, photos:{}, profiles:{}, scores:{}, histYear:null, histSort:"pres", shot:null, shotBusy:false, dl:null, drawSeen:{}, revealUntil:0
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const clampInt = (v,lo,hi,def) => { const n = parseInt(v,10); return Number.isFinite(n) ? Math.min(hi,Math.max(lo,n)) : def; };
const MONTH = new Intl.DateTimeFormat("pt-BR",{month:"long"});
/* Nome do grupo: aparece na aba do navegador, na tela de entrar, na imagem e nos textos do WhatsApp */
const appName = () => (window.PELADA_CONFIG && window.PELADA_CONFIG.appName) || "Resenha FC";
const GK_SPOTS = 2;   // vagas no gol
const MIN_TOTAL = 10; // mínimo de confirmados (linha + gol) pra dar jogo
const MIN_TEAM = 5;   // mínimo de pessoas por time, com ou sem goleiro

function today0(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
const WD = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const WD_SHORT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const isMasc = wd => wd === 0 || wd === 6;
const KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function nextRegular(from){ const d = new Date(from); d.setDate(d.getDate() + ((S.weekday - d.getDay() + 7) % 7)); return d; }
const isRegular = key => parseKey(key).getDay() === S.weekday;
const curKey = () => S.key || keyOf(nextRegular(today0()));
const curDate = () => parseKey(curKey());
const isPast = () => curDate() < today0();
const longDate = d => cap(WD[d.getDay()]) + ", " + d.getDate() + " de " + MONTH.format(d);
const shortDate = d => d.getDate() + "/" + pad(d.getMonth()+1);

function relLabel(){
  const d = curDate(), diff = Math.round((d - today0()) / 86400000), wd = d.getDay(), w = WD[wd], m = isMasc(wd);
  if(diff === 0) return "Hoje";
  if(diff === 1) return "Amanhã";
  if(diff === -1) return "Ontem";
  if(diff > 1 && diff <= 6) return (m ? "Esse " : "Essa ") + w;
  if(diff >= 7 && diff <= 13) return cap(w) + " que vem";
  if(diff < -1 && diff >= -7) return cap(w) + (m ? " passado" : " passada");
  return diff > 0 ? "Daqui a " + diff + " dias" : "Há " + (-diff) + " dias";
}
/* Dias que aparecem nas setas: o dia fixo de cada semana e qualquer dia que tenha jogo marcado */
function navSeq(){
  const set = new Set(Object.keys(S.games).filter(k => KEY_RE.test(k)));
  let d = addDays(nextRegular(today0()), -7*8);
  for(let i=0;i<17;i++){ set.add(keyOf(d)); d = addDays(d, 7); }
  set.add(curKey());
  return Array.from(set).sort();
}
/* Próximo jogo: o primeiro dia a partir de hoje com jogo confirmado ou esperando quadra */
function upcoming(){
  const t = keyOf(today0()), out = new Set();
  Object.keys(S.games).forEach(k => {
    const g = S.games[k];
    if(KEY_RE.test(k) && k >= t && g && (g.status === "confirmed" || g.status === "pending")) out.add(k);
  });
  let d = nextRegular(today0());
  for(let i=0;i<9;i++){
    const k = keyOf(d), g = S.games[k];
    if(!g || g.status !== "cancelled"){ out.add(k); break; }
    d = addDays(d, 7);
  }
  return Array.from(out).sort();
}
const defaultKey = () => upcoming()[0] || keyOf(nextRegular(today0()));
function fmtTime(t){
  if(!/^\d{2}:\d{2}$/.test(t || "")) return "";
  const [h,m] = t.split(":");
  return Number(h) + "h" + (m === "00" ? "" : m);
}
const isMember = () => !!(S.uid && S.members[S.uid]);
const isAdmin = () => S.isOwner || (!!S.uid && S.admins.includes(S.uid));

/* Rascunhos dos campos, pra não perder o que foi digitado quando a lista atualiza */
const dk = id => (id.startsWith("f-") || id.startsWith("x-") || id.startsWith("p-")) ? id + "@" + curKey() : id;
const dv = (id, def) => Object.prototype.hasOwnProperty.call(S.drafts, dk(id)) ? S.drafts[dk(id)] : def;
function clearDrafts(prefix){ const key = curKey(); Object.keys(S.drafts).forEach(k => { if(k.startsWith(prefix) && (k.endsWith("@"+key) || !k.includes("@"))) delete S.drafts[k]; }); }

/* ---------- Fotos ---------- */
const PHOTO_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const AV_COLORS = ["#2356A8","#B8432F","#1F7A55","#7A4FC4","#B56A12","#16809A","#A33C78","#4E5D78"];
function colorFor(id){
  const pr = S.profiles[id];
  if(pr && pr.color) return pr.color;
  let h = 0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function initials(name){
  const w = String(name || "").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "?";
  return (w.length > 1 ? w[0][0] + w[w.length-1][0] : w[0][0]).toUpperCase();
}
function avatarSrc(id){
  if(S.photos[id]) return S.photos[id];
  const mb = S.members[id];
  if(mb && typeof mb.avatar === "string" && /^https:\/\/[^\s"'<>]+$/.test(mb.avatar)) return mb.avatar;
  const pr = S.profiles[id];
  if(pr && typeof pr.avatarUrl === "string" && pr.avatarUrl && !pr.avatarUrl.startsWith("data:")) return pr.avatarUrl;
  return null;
}
function avatarHTML(id, name, cls){
  const src = avatarSrc(id);
  if(src) return '<img class="'+cls+'" src="'+esc(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer">';
  return '<span class="'+cls+' ini" style="--ac:'+esc(colorFor(id))+'" aria-hidden="true">'+esc(initials(name))+'</span>';
}
let profKey = "";
function ensureProfiles(){
  if(!S.user || typeof S.user.profiles !== "function") return;
  const ids = Object.keys(S.members).sort();
  const k = ids.join(",");
  if(k === profKey || !ids.length) return;
  profKey = k;
  S.user.profiles(ids).then(ps => { S.profiles = ps || {}; render(); }).catch(() => {});
}
function fileToPhoto(file){
  return new Promise((resolve, reject) => {
    if(!file || !/^image\//.test(file.type || "image/")) return reject(new Error("tipo"));
    const draw = (src, w, h) => {
      const SZ = 160, c = document.createElement("canvas");
      c.width = SZ; c.height = SZ;
      const ctx = c.getContext("2d"), m = Math.min(w, h);
      const sx = (w - m) / 2, sy = h > w ? (h - m) * 0.3 : (h - m) / 2;
      ctx.drawImage(src, sx, sy, m, m, 0, 0, SZ, SZ);
      let out = c.toDataURL("image/jpeg", 0.8);
      if(out.length > 60000) out = c.toDataURL("image/jpeg", 0.6);
      resolve(out);
    };
    const viaReader = () => {
      const r = new FileReader();
      r.onerror = () => reject(new Error("leitura"));
      r.onload = () => { const img = new Image(); img.onload = () => draw(img, img.naturalWidth, img.naturalHeight); img.onerror = () => reject(new Error("imagem")); img.src = r.result; };
      r.readAsDataURL(file);
    };
    if(typeof createImageBitmap === "function"){
      createImageBitmap(file).then(bm => draw(bm, bm.width, bm.height)).catch(viaReader);
    } else viaReader();
  });
}

/* ---------- Dados do jogo ---------- */
function gameInfo(key){
  const raw = S.games[key];
  const g = raw && typeof raw === "object" ? raw : null;
  const status = g && ["confirmed","cancelled","pending"].includes(g.status) ? g.status : (isRegular(key) ? "pending" : "none");
  const spots = clampInt(g && g.spots, 8, 40, 14);
  const going = [], gk = [], no = [], none = [];
  Object.keys(S.members).forEach(uid => {
    const m = S.members[uid] || {};
    const name = (typeof m.nick === "string" && m.nick.trim()) ? m.nick.trim() : "Sem apelido";
    const ans = m.answers && typeof m.answers === "object" ? m.answers[key] : null;
    const a = ans && typeof ans === "object" ? ans : null;
    const p = { id:uid, name, me: uid === S.uid, avulso:false, at: Number(a && a.at) || 0, gk: !!(a && a.gk) };
    if(!a) none.push(p);
    else if(a.going) (p.gk ? gk : going).push(p);
    else no.push(p);
  });
  const extras = g && Array.isArray(g.extras) ? g.extras : [];
  extras.forEach(x => {
    if(!x || typeof x.name !== "string" || typeof x.id !== "string") return;
    const p = { id:x.id, name:x.name.trim() || "Avulso", me:false, avulso:true, at:Number(x.at)||0, gk:!!x.gk };
    (p.gk ? gk : going).push(p);
  });
  const byAt = (a,b) => a.at - b.at;
  going.sort(byAt); gk.sort(byAt);
  const byName = (a,b) => a.name.localeCompare(b.name,"pt-BR");
  no.sort(byName); none.sort(byName);
  const list = going.slice(0,spots), gkIn = gk.slice(0,GK_SPOTS);
  const total = list.length + gkIn.length;
  return { g, status, spots, list, wait: going.slice(spots), gk: gkIn, gkWait: gk.slice(GK_SPOTS), no, none, total, need: Math.max(0, MIN_TOTAL - total) };
}

function parseMoney(v){
  const t = String(v == null ? "" : v).replace(/[^\d,.]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const n = parseFloat(t);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
}
const numTxt = n => n ? String(n).replace(".", ",") : "";
function payInfo(I){
  const p = I.g && I.g.pay && typeof I.g.pay === "object" ? I.g.pay : null;

function payDefaults(I){

/* ---------- Placar ---------- */
function validMatches(g, n){
  const ms = g && Array.isArray(g.matches) ? g.matches : [];
  const ids = a => Array.isArray(a) ? a.filter(x => typeof x === "string").slice(0,40) : [];
  return ms.filter(m => m && typeof m.id === "string" && Number.isInteger(m.a) && Number.isInteger(m.b) && m.a !== m.b && m.a >= 0 && m.b >= 0 && (!n || (m.a < n && m.b < n)))
    .map(m => ({ id:m.id, a:m.a, b:m.b, ga:clampInt(m.ga,0,99,0), gb:clampInt(m.gb,0,99,0), pa:ids(m.pa), pb:ids(m.pb), at:Number(m.at) || 0 }));
}
/* Quem ganha fica; no empate fica quem entrou por último. O próximo é quem espera há mais tempo. */
function suggestMatch(n, ms){
  let queue = [], a = 0, b = 1;
  for(let i=2;i<n;i++) queue.push(i);
  ms.forEach(m => {
    const stay = m.ga > m.gb ? m.a : m.b, leave = stay === m.a ? m.b : m.a;
    queue = queue.filter(t => t !== m.a && t !== m.b);
    queue.push(leave);
    a = stay; b = queue[0];
  });
  if(b === undefined || b === a) b = (a + 1) % n;
  return { a, b };
}
function nightTable(n, ms){
  const t = []; for(let i=0;i<n;i++) t.push({ i, j:0, v:0, e:0, d:0, gp:0, gc:0 });
  ms.forEach(m => {
    const A = t[m.a], B = t[m.b]; if(!A || !B) return;
    A.j++; B.j++; A.gp += m.ga; A.gc += m.gb; B.gp += m.gb; B.gc += m.ga;
    if(m.ga > m.gb){ A.v++; B.d++; } else if(m.gb > m.ga){ B.v++; A.d++; } else { A.e++; B.e++; }
  });
  t.forEach(r => r.pts = r.v*3 + r.e);
  return t.filter(r => r.j).sort((x,y) => y.pts - x.pts || (y.gp - y.gc) - (x.gp - x.gc) || y.gp - x.gp);
}

/* ---------- Histórico ---------- */
function histGames(year){
  const todayK = keyOf(today0()), out = [];
  Object.keys(S.games).filter(k => KEY_RE.test(k) && (!year || k.slice(0,4) === String(year))).sort().forEach(k => {
    const I = gameInfo(k);
    if(I.status !== "confirmed") return;
    const draw = validDraw(I.g), ms = validMatches(I.g, draw ? draw.teams.length : 0);
    if(!(k < todayK || (k === todayK && ms.length))) return;
    if(!draw && I.need > 0) return;
    const ids = draw ? [].concat.apply([], draw.teams).map(p => p.id) : I.list.concat(I.gk).map(p => p.id);
    out.push({ k, I, draw, ms, ids });
  });
  return out;
}
function histYears(){
  const ys = new Set([today0().getFullYear()]);
  histGames(null).forEach(x => ys.add(Number(x.k.slice(0,4))));
  return Array.from(ys).sort((a,b) => b - a);
}
function histRows(games){
  const rows = {};
  const get = id => rows[id] || (rows[id] = { id, jogos:0, part:0, v:0, e:0, d:0 });
  games.forEach(G => {
    G.ids.forEach(id => { if(S.members[id]) get(id).jogos++; });
    G.ms.forEach(m => {
      const r = m.ga > m.gb ? 1 : m.ga < m.gb ? -1 : 0;
      const add = (id, res) => { if(!S.members[id]) return; const x = get(id); x.part++; if(res > 0) x.v++; else if(res < 0) x.d++; else x.e++; };
      m.pa.forEach(id => add(id, r)); m.pb.forEach(id => add(id, -r));
    });
  });
  return Object.keys(rows).map(id => { const x = rows[id]; x.pct = x.part ? Math.round((3*x.v + x.e) / (3*x.part) * 100) : null; x.name = nameNow(id, "Alguém", null); return x; });
}

const TEAM_COLORS = ["#F2C230","#F08A24","#2FA36B","#D9483B","#8B5CF6","#1BA8C7","#E056A0","#7A8699"];
function validDraw(g){
  const d = g && g.draw;
  if(!d || typeof d !== "object" || !Array.isArray(d.teams)) return null;
  const teams = d.teams.slice(0,8).map(t => Array.isArray(t)
    ? t.filter(p => p && typeof p.id === "string").slice(0,20).map(p => ({ id:p.id, name: typeof p.name === "string" ? p.name : "", gk: !!p.gk }))
    : []).filter(t => t.length);
  if(teams.length < 2) return null;
  return { at: Number(d.at) || 0, by: typeof d.by === "string" ? d.by : "", nt: teams.length, v: Number(d.v) || 1, teams };
}
function nameNow(id, fallback, I){
  const m = S.members[id];
  if(m && typeof m.nick === "string" && m.nick.trim()) return m.nick.trim();
  const x = I && I.g && Array.isArray(I.g.extras) ? I.g.extras.find(e => e && e.id === id) : null;
  if(x && typeof x.name === "string" && x.name.trim()) return x.name.trim();
  return fallback || "Alguém";
}
function randInt(n){
  try{ const r = new Uint32Array(1); crypto.getRandomValues(r); return r[0] % n; }catch(e){ return Math.floor(Math.random()*n); }
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = randInt(i+1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
/* Tamanho de cada time contando todo mundo da lista (linha + gol).
   Os primeiros times recebem um goleiro cada. Quando a conta não fecha,
   quem sobra vai primeiro pros times sem goleiro, que precisam tirar alguém da linha pro gol. */
function planTeams(T, g, L){
  const N = g + L, base = Math.floor(N / T);
  let rem = N % T;
  const plan = [];
  for(let i=0;i<T;i++) plan.push({ gk: i < g ? 1 : 0, size: base });
  for(let i=T-1;i>=0 && rem>0;i--){ plan[i].size++; rem--; }
  return plan;
}
function makeDraw(I, T){
  const gks = shuffle(I.gk.map(p => ({ id:p.id, name:p.name, gk:true }))).slice(0, T);
  const pool = shuffle(I.list.map(p => ({ id:p.id, name:p.name })));
  const plan = planTeams(T, gks.length, pool.length);
  let k = 0;
  const teams = plan.map((pl, i) => {
    const t = pl.gk ? [gks[i]] : [];
    const n = pl.size - pl.gk;
    for(let j=0;j<n && k<pool.length;j++) t.push(pool[k++]);
    return t;
  });
  while(k < pool.length) teams[teams.length-1].push(pool[k++]);
  return { v:2, at: Date.now(), by: S.uid || "", nt: T, teams: shuffle(teams) };
}
function drawCounts(I, T){ return { N: I.list.length + Math.min(I.gk.length, T), g: Math.min(I.gk.length, T), L: I.list.length }; }
function canDraw(I, T){ const c = drawCounts(I, T); return c.N >= MIN_TEAM*T && c.L >= T; }
const MAX_TEAMS = 6;
/* Só as quantidades de times que fecham com 5 por time, contando goleiros */
function teamOptions(I){ const out = []; for(let v=2; v<=MAX_TEAMS; v++) if(canDraw(I, v)) out.push(v); return out; }
function curNt(I, draw){
  const opts = teamOptions(I);
  let T = S.nt || (draw && draw.nt) || 2;
  if(!opts.includes(T)) T = opts.length ? opts[opts.length-1] : 2;
  return T;
}
function teamRole(i){
  if(i < 2) return "Começa jogando";
  return i === 2 ? "Próximo" : "Depois do Time " + i;
}
function joinNames(arr){ return arr.length <= 1 ? (arr[0] || "") : arr.slice(0,-1).join(", ") + " e " + arr[arr.length-1]; }
function drawWhen(at){
  const d = new Date(at), t = today0();
  const hm = d.getHours() + "h" + pad(d.getMinutes());
  return d >= t ? "às " + hm : "em " + d.getDate() + "/" + (d.getMonth()+1) + " às " + hm;
}
function sizesText(sizes){
  sizes = sizes.slice().sort((a,b) => b - a);
  if(sizes.length === 2) return sizes[0] + " x " + sizes[1];
  return joinNames(sizes.map(String));
}

function formationRows(n){

function rowXs(k){
  if(k === 1) return [50];

  for(let i=0;i<k;i++) out.push(pad + (100-2*pad)*i/(k-1));

/* Futsal: 5 em quadra (goleiro + 4 na linha). Quem passar disso vai pro banco.
   Time sem goleiro: um dos sorteados começa no gol, revezando. */
const ON_COURT = 4;
function splitTeam(team){
  const gks = team.filter(p => p.gk), rest = team.filter(p => !p.gk);
  let goal = gks[0] || null, rot = false;
  if(!goal && rest.length){ goal = rest.pop(); rot = true; }
  return { goal, rot, starters: rest.slice(0, ON_COURT), bench: rest.slice(ON_COURT).concat(gks.slice(1)) };
}
/* geo: posição (em % da altura da quadra) do goleiro e da primeira e última fileira */
function teamOnPitch(team, color, geo, current, I, v){
  const sp = splitTeam(team);
  const rows = formationRows(sp.starters.length), R = rows.length, ys = rowYs(R, geo.back, geo.front);
  let h = "", k = 0, i = 0;
  if(sp.goal) h += tokHTML(sp.goal, 50, geo.gk, "GOL", color, i++, current, I, sp.rot && v >= 2);
  rows.forEach((cnt, ri) => rowXs(cnt).forEach(x => { const p = sp.starters[k++]; if(p) h += tokHTML(p, x, ys[ri], posLabel(ri, R), color, i++, current, I, false); }));
  return { html:h, bench: sp.bench, rot: sp.rot, next: i };
}
function btokHTML(p, color, i, current, I){

/* Quadra deitada: Time 1 ataca pra direita, Time 2 pra esquerda */
function lateralYs(k){
  if(k === 1) return [50];
  const pad = k === 2 ? 27 : k === 3 ? 17 : 11, out = [];
  for(let i=0;i<k;i++) out.push(pad + (100-2*pad)*i/(k-1));

function teamOnPitchH(team, color, side, current, I, v){

  rows.forEach((cnt, ri) => lateralYs(cnt).forEach(y => { const p = sp.starters[k++]; if(p) h += tokHTML(p, xs[ri], y, posLabel(ri, R), color, i++, current, I, false); }));
  return { html:h, bench: sp.bench, next: i };

    else rows.sort((a,b) => b.jogos - a.jogos || b.v - a.v || a.name.localeCompare(b.name,"pt-BR"));

function teamsText(){
  const d = curDate(), I = gameInfo(curKey()), draw = validDraw(I.g);
  if(!draw) return "";
  const current = new Set(I.list.map(p => p.id).concat(I.gk.map(p => p.id)));
  const L = ["⚽ Times do " + appName() + ", " + WD[d.getDay()] + " " + shortDate(d), "Começam: Time 1 x Time 2"];
  draw.teams.forEach((t,ti) => {
    const extra = ti < 2 ? "" : ", " + teamRole(ti).toLowerCase();
    L.push("", "Time " + (ti+1) + " (" + t.length + extra + ")");
    const sp = splitTeam(t), nm = p => nameNow(p.id, p.name, I) + (current.has(p.id) ? "" : " (saiu)");
    if(sp.goal) L.push("🧤 " + nm(sp.goal) + (sp.rot && draw.v >= 2 ? " (sem goleiro, revezem)" : ""));
    sp.starters.forEach(p => L.push("• " + nm(p)));
    if(sp.bench.length) L.push("🪑 Banco: " + sp.bench.map(nm).join(", "));
  });
  const drawn = new Set(); draw.teams.forEach(t => t.forEach(p => drawn.add(p.id)));
  const joined = I.list.concat(I.gk).filter(p => !drawn.has(p.id)).map(p => p.name);
  if(joined.length) L.push("", "Entraram depois do sorteio: " + joinNames(joined));
  return L.join("\n");
}

/* ---------- Render ---------- */
const TEXTY = el => !!el && ((el.tagName === "INPUT" && !["checkbox","radio","button","submit"].includes(el.type)) || el.tagName === "TEXTAREA");
function setHTML(el, html){
  if(el._h === html) return;
  const a = document.activeElement;
  if(TEXTY(a) && el.contains(a)){ el._pending = true; return; }
  const fid = a && el.contains(a) ? a.id : null;
  el.innerHTML = html; el._h = html; el._pending = false;
  if(fid){ const n = document.getElementById(fid); if(n) n.focus({preventScroll:true}); }
}
function render(){
  if(S.tab === "admin" && !(S.state === "ready" && isAdmin() && !S.readOnly)) S.tab = "jogo";
  setHTML($("tabs"), tabsHTML());
  ["jogo","sorteio","hist","admin"].forEach(t => { $("p-"+t).hidden = S.tab !== t; });
  setHTML($("nav"), navHTML());
  setHTML($("pick"), pickHTML());
  const hb = heroBody();
  $("hero").className = "hero" + (hb.cls ? " " + hb.cls : "");
  setHTML($("hero-body"), hb.html);

  setHTML($("pay"), payHTML());

  setHTML($("draw-ctl"), drawCtlHTML());
  setHTML($("hist"), histHTML());
  setHTML($("lists"), listsHTML());
  setHTML($("admin"), adminHTML());
  setHTML($("foot"), footHTML());
}

let toastT;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800);
}
function arm(which){
  S.armed = which; clearTimeout(S.armTimer);
  S.armTimer = setTimeout(() => { S.armed = null; render(); }, 4000);
  render();
}
function disarm(){ S.armed = null; clearTimeout(S.armTimer); }

/* ---------- Gravação ---------- */
async function run(fn, msg){
  if(S.busy || !S.db) return false;
  S.busy = true; render();
  let ok = false;
  try{
    try{ await fn(); }
    catch(e){
      if(e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); await fn(); }
      else throw e;
    }
    ok = true;
    if(msg) toast(msg);
  }catch(e){
    console.error(e);
    const c = e && e.code;
    if(c === "invalid_argument" || c === "not_granted"){
      toast("Sem permissão pra salvar isso. Se você é adm, recarregue a página.");
    } else if(c === "quota_exceeded"){
      toast("O espaço da lista encheu. Fale com quem criou a página.");
    } else if(c === "revoked"){
      S.state = "off"; toast("O acesso à lista mudou. Recarregue a página.");
    } else {
      toast("Não deu pra salvar. Tenta de novo.");
    }
  }finally{
    S.busy = false; render();
  }
  return ok;
}

function prune(ans){
  const lim = new Date(); lim.setDate(lim.getDate() - 400);
  const k = keyOf(lim), out = {};
  Object.keys(ans).forEach(kk => { if(kk >= k) out[kk] = ans[kk]; });
  return out;
}
function memberWithAnswer(going, gk){
  const key = curKey();
  const m = clone(S.members[S.uid]);
  const answers = m.answers && typeof m.answers === "object" ? m.answers : {};
  const prev = answers[key];
  const keep = going && prev && prev.going && !!prev.gk === !!gk;
  const at = keep ? (Number(prev.at) || Date.now()) : Date.now();
  answers[key] = { going: !!going, gk: !!gk, at };
  m.answers = prune(answers);
  return m;

function gamePayload(status, fields, extras, draw){

    extras: extras || clone(Array.isArray(g.extras) ? g.extras : []),

const FD = '"Saira Extra Condensed","Arial Narrow",sans-serif', FB = '"Saira",system-ui,sans-serif';
function loadImg(src){
  return new Promise(res => {
    if(!src) return res(null);
    const im = new Image(); let done = false;
    if(/^https?:/.test(src)){ im.crossOrigin = "anonymous"; im.referrerPolicy = "no-referrer"; }
    const fin = v => { if(!done){ done = true; res(v); } };

    setTimeout(() => fin(null), 4000);
    im.src = src;
  });
}
function rrect(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X+r, Y); x.arcTo(X+W, Y, X+W, Y+H, r); x.arcTo(X+W, Y+H, X, Y+H, r); x.arcTo(X, Y+H, X, Y, r); x.arcTo(X, Y, X+W, Y, r); x.closePath(); }

function drawCourtV(x, X, Y, W, H){
  x.save(); rrect(x, X, Y, W, H, 28); x.clip();
  const gr = x.createLinearGradient(X, Y, X, Y+H); gr.addColorStop(0, "#2A5EB2"); gr.addColorStop(1, "#1E4C98");
  x.fillStyle = gr; x.fillRect(X, Y, W, H);
  x.fillStyle = "rgba(255,255,255,.045)"; for(let i=0;i<16;i+=2) x.fillRect(X, Y + H*i/16, W, H/16);
  const vg = x.createRadialGradient(X+W/2, Y+H/2, Math.min(W,H)*0.3, X+W/2, Y+H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.32)"); x.fillStyle = vg; x.fillRect(X, Y, W, H);
  const m = 22, L = X+m, T = Y+m, R = X+W-m, B = Y+H-m, cx = X+W/2, cy = Y+H/2;
  const rx = (R-L)*0.3, ry = (B-T)*0.15, pL = cx-(R-L)*0.075, pR = cx+(R-L)*0.075;
  x.strokeStyle = "rgba(255,255,255,.6)"; x.lineWidth = 4;
  x.strokeRect(L, T, R-L, B-T);
  x.beginPath(); x.moveTo(L, cy); x.lineTo(R, cy); x.stroke();
  x.beginPath(); x.arc(cx, cy, (R-L)*0.15, 0, Math.PI*2); x.stroke();
  x.beginPath(); x.ellipse(pL, B, rx, ry, 0, Math.PI, Math.PI*1.5); x.lineTo(pR, B-ry); x.ellipse(pR, B, rx, ry, 0, Math.PI*1.5, Math.PI*2); x.stroke();
  x.beginPath(); x.ellipse(pL, T, rx, ry, 0, Math.PI, Math.PI*0.5, true); x.lineTo(pR, T+ry); x.ellipse(pR, T, rx, ry, 0, Math.PI*0.5, 0, true); x.stroke();
  x.strokeRect(pL, B, pR-pL, 12); x.strokeRect(pL, T-12, pR-pL, 12);
  x.fillStyle = "rgba(255,255,255,.7)"; x.beginPath(); x.arc(cx, cy, 6, 0, Math.PI*2); x.fill();
  x.restore();
}
function drawTok(x, cx, cy, r, color, img, name, id, o){
  x.save();
  x.globalAlpha = o.gone ? .5 : 1;
  x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 16; x.shadowOffsetY = 6;
  x.beginPath(); x.arc(cx, cy, r+6, 0, Math.PI*2); x.fillStyle = o.rot ? "#1B2A48" : color; x.fill();
  x.shadowColor = "transparent";
  if(o.rot){ x.setLineDash([12, 8]); x.lineWidth = 6; x.strokeStyle = color; x.beginPath(); x.arc(cx, cy, r+3, 0, Math.PI*2); x.stroke(); x.setLineDash([]); }
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2); x.clip();
  if(img){
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.max(2*r/iw, 2*r/ih);
    x.drawImage(img, cx - iw*k/2, cy - ih*k/2, iw*k, ih*k);
  } else {
    x.fillStyle = colorFor(id); x.fillRect(cx-r, cy-r, 2*r, 2*r);
    x.fillStyle = "#fff"; x.font = "800 " + Math.round(r*0.9) + "px " + FD; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(initials(name), cx, cy + 2);
  }

  if(o.pos){
    x.font = "800 " + Math.round(r*0.36) + "px " + FB;
    const tw = x.measureText(o.pos).width + 14, th = Math.round(r*0.52), X0 = cx - r - 8, Y0 = cy - r - 12;

    x.fillStyle = "#1A1400"; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(o.pos, X0 + 7, Y0 + th/2 + 1);
  }
  const fs = Math.round(r*0.62);
  x.font = "700 " + fs + "px " + FD; x.textAlign = "center"; x.textBaseline = "middle";
  const label = fitText(x, name + (o.gone ? " (saiu)" : ""), o.maxW || r*3.6);
  const w = x.measureText(label).width + 22, h = fs + 12, py = cy + r + 12;
  rrect(x, cx - w/2, py, w, h, 8); x.fillStyle = o.me ? "#F2C230" : "rgba(8,15,30,.9)"; x.fill();
  x.fillStyle = o.me ? "#231B00" : "#fff"; x.fillText(label, cx, py + h/2 + 1);
  x.restore();

async function lineupCanvas(localOnly){

  while(x.measureText(title).width > W - 112 && tf > 56){ tf -= 4; x.font = "800 " + tf + "px " + FD; }
  x.fillText(title, 56, 186);
  const where = [fmtTime(g.time), String(g.place || "").trim()].filter(Boolean).join(", ");

      const max = Math.floor((Hh - 70) / 128), shown = list.slice(0, max), step = (Hh - 70) / Math.max(shown.length, 1);
      shown.forEach((p, j) => drawTok(x, BX + BW/2, Y0 + 70 + step*j + step/2 - 24, 36, color, imgs[p.id], nameNow(p.id, p.name, I), p.id, { gone: !current.has(p.id), me: p.id === S.uid, maxW: BW - 16 }));

  x.fillText("Começam Time 1 x Time 2", 60, H - 36);

function goKey(k){
  if(!k || !KEY_RE.test(k)) return;
  S.key = k; S.userNav = true;
  disarm(); S.renaming = false; S.nt = null; $("copyout").innerHTML = "";
  render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "prev": { const q = navSeq(), i = q.indexOf(curKey()); if(i > 0) goKey(q[i-1]); break; }
    case "next": { const q = navSeq(), i = q.indexOf(curKey()); if(i >= 0 && i < q.length-1) goKey(q[i+1]); break; }
    case "today": goKey(defaultKey()); break;
    case "go": goKey(b.dataset.key); break;
    case "pick": S.picking = !S.picking; render(); if(S.picking) setTimeout(() => { const i = $("pick-date"); if(i) i.focus(); }, 0); break;
    case "pick-close": S.picking = false; render(); break;
    case "join": doJoin(); break;
    case "yes": { S.popPending = true; const m = memberWithAnswer(true, S.gkPre); run(() => memberRef().set(m)); break; }
    case "no": { S.popPending = false; const m = memberWithAnswer(false, false); run(() => memberRef().set(m)); break; }
    case "g-confirm": saveGameFromForm("confirmed", "Quadra confirmada. Lista aberta!"); break;
    case "g-save": saveGameFromForm("confirmed", "Alterações salvas."); break;
    case "g-cancel": {
      const I = gameInfo(curKey());
      if(I.status === "confirmed" && S.armed !== "cancel"){ arm("cancel"); return; }
      disarm(); saveGameFromForm("cancelled", "Esse dia ficou sem jogo."); break;
    }
    case "g-pending": saveGameFromForm("pending", I_isNone() ? "Pronto, a galera sabe que tá vendo quadra." : "Voltou pra aguardando."); break;
    case "x-add": addExtra(); break;
    case "x-rm": removeExtra(b.dataset.id); break;
    case "copy": copyList(); break;
    case "signin": if(S.auth){ S.busy = true; render(); S.auth.signIn().catch(e => { console.error(e); toast(e && e.message ? e.message : "Não deu pra entrar. Tenta de novo."); }).finally(() => { S.busy = false; render(); }); } break;
    case "signout": if(S.auth) S.auth.signOut().then(() => location.reload()); break;
    case "tab": goTab(b.dataset.tab); break;
    case "photo-rm": run(() => S.db.collection("photos").doc(S.uid).delete(), "Foto removida."); break;
    case "copy-teams": copyText(teamsText(), "Times copiados. É só colar no grupo."); break;
    case "shot": makeShot(); break;
    case "shot-save": saveShot(); break;
    case "shot-close": closeShot(); break;
    case "copy-pix": { const P = payInfo(gameInfo(curKey())); if(P && P.pix) copyText(P.pix, "Chave Pix copiada."); break; }
    case "pay-save": {
      const price = parseMoney($("p-price") && $("p-price").value), cost = parseMoney($("p-cost") && $("p-cost").value);
      if(!price){ toast("Coloca o valor por pessoa."); const i = $("p-price"); if(i) i.focus(); break; }
      const pay = { price, cost: cost || 0, gkFree: !!($("p-gkfree") && $("p-gkfree").checked), pix: (($("p-pix") && $("p-pix").value) || "").trim().slice(0,80) };
      const payload = gamePatch({ pay });
      if(payload) run(() => gameRef().set(payload), "Valores salvos.").then(ok => { if(ok){ clearDrafts("p-"); render(); } });
      break;
    }
    case "sc": {
      const st = S.scores[curKey()]; if(!st) break;
      const k = "g" + b.dataset.side; st[k] = Math.max(0, Math.min(30, st[k] + Number(b.dataset.d)));
      render(); break;
    }
    case "sc-save": {
      const key = curKey(), I = gameInfo(key), draw = validDraw(I.g), st = S.scores[key];
      if(!draw || !st || st.a === st.b || !draw.teams[st.a] || !draw.teams[st.b]) break;
      const ms = clone(Array.isArray(I.g.matches) ? I.g.matches : []);
      ms.push({ id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), a: st.a, b: st.b, ga: st.ga, gb: st.gb,
        pa: draw.teams[st.a].map(p => p.id), pb: draw.teams[st.b].map(p => p.id), at: Date.now() });
      const payload = gamePatch({ matches: ms });
      const res = st.ga === st.gb ? "Empate anotado." : "Time " + ((st.ga > st.gb ? st.a : st.b) + 1) + " venceu. Partida anotada.";
      if(payload) run(() => gameRef().set(payload), res).then(ok => { if(ok){ delete S.scores[key]; render(); } });
      break;
    }
    case "sc-del": {
      const id = b.dataset.id;
      if(S.armed !== "scdel:" + id){ arm("scdel:" + id); return; }
      disarm();
      const g = S.games[curKey()]; if(!g) break;
      const payload = gamePatch({ matches: clone((g.matches || []).filter(m => m && m.id !== id)) });
      run(() => gameRef().set(payload), "Partida apagada.").then(ok => { if(ok){ delete S.scores[curKey()]; render(); } });
      break;
    }
    case "h-year": S.histYear = clampInt(b.dataset.v, 2000, 2100, today0().getFullYear()); render(); break;
    case "h-sort": S.histSort = b.dataset.v === "vit" ? "vit" : "pres"; render(); break;
    case "h-go": {
      const k = b.dataset.key, draw = validDraw(S.games[k]);
      goKey(k); goTab(draw ? "sorteio" : "jogo"); window.scrollTo({ top: 0 }); break;
    }
    case "nt": S.nt = clampInt(b.dataset.v, 2, MAX_TEAMS, 2); disarm(); render(); break;
    case "draw": doDraw(); break;
    case "redraw": if(S.armed !== "redraw"){ arm("redraw"); return; } disarm(); doDraw(); break;
    case "undraw": if(S.armed !== "undraw"){ arm("undraw"); return; } disarm(); undoDraw(); break;
    case "rename": S.renaming = true; render(); setTimeout(() => { const i = $("r-nick"); if(i){ i.focus(); i.select(); } }, 0); break;
    case "r-cancel": S.renaming = false; clearDrafts("r-nick"); render(); break;
    case "r-save": doRename(); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t && t.hasAttribute && t.hasAttribute("data-draft")) S.drafts[dk(t.id)] = t.type === "checkbox" ? t.checked : t.value;
});
function I_isNone(){ return gameInfo(curKey()).status === "none"; }
document.addEventListener("change", e => {
  const t = e.target; if(!t) return;
  if(t.id === "photo-in"){
    const f = t.files && t.files[0]; t.value = "";
    if(!f) return;
    fileToPhoto(f).then(src => {
      if(!PHOTO_RE.test(src)) throw new Error("formato");
      run(() => S.db.collection("photos").doc(S.uid).set({ src, at: Date.now() }), "Foto atualizada.");
    }).catch(() => toast("Não deu pra usar essa imagem. Tenta outra."));
    return;
  }
  if(t.id === "pick-date"){ if(KEY_RE.test(t.value)){ S.picking = false; t.blur(); goKey(t.value); } return; }
  if(t.id === "set-weekday"){
    const wd = clampInt(t.value, 0, 6, 4);
    run(() => S.db.doc("config/settings").set({ weekday: wd }), "Agora o dia fixo é " + WD[wd] + ".");
    return;
  }
  if(t.id === "gk-pre"){ S.gkPre = t.checked; return; }
  if(t.id === "gk-now"){
    const m = memberWithAnswer(true, t.checked);
    const full = gameInfo(curKey()).gk.length >= GK_SPOTS;
    run(() => memberRef().set(m), t.checked ? (full ? "O gol tá lotado, você ficou na espera do gol." : "Beleza, você vai no gol.") : "Beleza, você vai na linha.");
    return;
  }
  if(t.id === "sc-a" || t.id === "sc-b"){
    const st = S.scores[curKey()]; if(st){ st[t.id.slice(3)] = clampInt(t.value, 0, 7, 0); render(); }
    return;
  }
  if(t.dataset && t.dataset.paid){
    const g = S.games[curKey()]; if(!g) return;
    const paid = clone(g.paid && typeof g.paid === "object" ? g.paid : {});
    if(t.checked) paid[t.dataset.paid] = Date.now(); else delete paid[t.dataset.paid];
    const payload = gamePatch({ paid });
    run(() => gameRef().set(payload), t.checked ? "Marcado como pago." : "Pagamento desmarcado.");
    return;
  }
  if(t.dataset && t.dataset.adm){
    const ids = new Set(S.admins);
    if(t.checked) ids.add(t.dataset.adm); else ids.delete(t.dataset.adm);
    const payload = { ids: Array.from(ids) };
    run(() => S.db.doc("config/admins").set(payload), t.checked ? "Agora é adm." : "Não é mais adm.");
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-draft")) S.drafts[dk(t.id)] = t.type === "checkbox" ? t.checked : t.value;
});
document.addEventListener("keydown", e => {
  if(!e.target) return;
  if(e.target.getAttribute && e.target.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    const tabs = Array.from(document.querySelectorAll('[role="tab"]')), i = tabs.indexOf(e.target);
    const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    if(n){ e.preventDefault(); goTab(n.dataset.tab); }
    return;
  }
  if(e.target.id === "photo-lbl" && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); const i = $("photo-in"); if(i) i.click(); return; }
  if(e.key === "Escape" && S.shot){ e.preventDefault(); closeShot(); return; }
  if(e.key === "Tab" && S.shot){
    const f = Array.from($("shot").querySelectorAll("button")); if(!f.length) return;
    const i = f.indexOf(document.activeElement), n = e.shiftKey ? (i <= 0 ? f.length-1 : i-1) : (i === f.length-1 ? 0 : i+1);
    e.preventDefault(); f[n].focus(); return;
  }
  if(e.key !== "Enter") return;
  const id = e.target.id;
  if(id === "j-nick"){ e.preventDefault(); doJoin(); }
  else if(id === "p-price" || id === "p-cost" || id === "p-pix"){ e.preventDefault(); const b = $("pay-save"); if(b) b.click(); }
  else if(id === "x-name"){ e.preventDefault(); addExtra(); }
  else if(id === "r-nick"){ e.preventDefault(); doRename(); }
});
document.addEventListener("focusout", () => {
  setTimeout(() => { if(!TEXTY(document.activeElement)) render(); }, 300);
});

/* ---------- Início ---------- */
document.title = appName();
function markReady(){
  if(S.state !== "off" && S.loaded.m && S.loaded.g && S.loaded.a && S.loaded.s){
    if(S.state !== "ready" && !S.userNav) S.key = defaultKey();
    S.state = "ready";
  }
  render();
}
function waitBackend(){
  return new Promise(res => {
    if(window.PeladaBackend) return res(window.PeladaBackend);
    window.addEventListener("pelada-backend", () => res(window.PeladaBackend), { once:true });
    setTimeout(() => res(window.PeladaBackend || null), 20000);
  });
}
async function init(){
  render();
  const B = await waitBackend();
  if(!B){ S.state = "off"; render(); return; }
  if(B.setupNeeded){ S.state = "setup"; render(); return; }
  S.auth = B.auth;
  let started = false;
  B.auth.onChange(u => {
    if(u && !started){ started = true; start(B, u); }
    else if(!u && !started){ S.state = "signin"; render(); }
    else if(!u && started){ location.reload(); }
  });
}
async function start(B, u){
  S.state = "loading"; render();
  S.dl = B.downloads || null;
  S.user = B.user;
  S.uid = u.uid; S.email = u.email || ""; S.meName = u.displayName || "";
  S.isOwner = B.isOwner(u);
  const db = B.db;
  S.db = db;
  let avatarChecked = false;
  const onErr = e => {
    console.error(e);
    S.subErr = true;
    if(e && e.code === "not_granted") S.readOnly = true;
    render();
  };
  db.collection("members").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if(d.exists){ const v = d.data(); if(v && typeof v === "object") m[d.id] = v; } });
    S.members = m; S.loaded.m = true; markReady();
    // Guarda a foto da conta Google no perfil, pra galera ver
    const mine = m[S.uid];
    if(!avatarChecked && mine){
      avatarChecked = true;
      const url = u.photoURL || "";
      if(url && mine.avatar !== url){ const up = clone(mine); up.avatar = url; db.collection("members").doc(S.uid).set(up).catch(() => {}); }
    }
  }, onErr);
  db.collection("games").onSnapshot(snap => {
    const g = {}; snap.docs.forEach(d => { if(d.exists){ const v = d.data(); if(v && typeof v === "object") g[d.id] = v; } });
    S.games = g; S.loaded.g = true; markReady();
  }, onErr);
  db.doc("config/admins").onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.admins = v && Array.isArray(v.ids) ? v.ids.filter(x => typeof x === "string") : [];
    S.loaded.a = true; markReady();
  }, onErr);
  db.collection("photos").onSnapshot(snap => {
    const ph = {};
    snap.docs.forEach(d => { if(d.exists){ const v = d.data(); if(v && typeof v.src === "string" && v.src.length < 250000 && PHOTO_RE.test(v.src)) ph[d.id] = v.src; } });
    S.photos = ph; render();
  }, onErr);
  db.doc("config/settings").onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.weekday = v ? clampInt(v.weekday, 0, 6, 4) : 4;
    S.loaded.s = true; markReady();
  }, onErr);
}
init();
})();
